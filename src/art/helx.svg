<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#160a1e"/><stop offset=".4" stop-color="#6b1f3a"/><stop offset=".62" stop-color="#e2562e"/><stop offset=".74" stop-color="#ffa63c"/><stop offset="1" stop-color="#ffd58a"/></linearGradient>
  <radialGradient id="sun" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff7d6"/><stop offset=".5" stop-color="#ffcf6a"/><stop offset="1" stop-color="#ff9f43" stop-opacity="0"/></radialGradient>
  <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a3a1c"/><stop offset=".3" stop-color="#4a2212"/><stop offset="1" stop-color="#170b06"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a4f9e"/><stop offset=".45" stop-color="#132b66"/><stop offset="1" stop-color="#0b1a42"/></linearGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffb35a" stop-opacity="0"/><stop offset=".42" stop-color="#ffd58a" stop-opacity=".5"/><stop offset=".58" stop-color="#ffd58a" stop-opacity=".5"/><stop offset="1" stop-color="#ffb35a" stop-opacity="0"/></linearGradient>
  <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9ced6"/><stop offset="1" stop-color="#6f7680"/></linearGradient>
</defs>
<rect width="1200" height="900" fill="url(#sky)"/>
<g stroke="#ffe0a0" stroke-opacity=".22" stroke-width="2">
  <line x1="600" y1="560" x2="600" y2="60"/><line x1="600" y1="560" x2="180" y2="200"/><line x1="600" y1="560" x2="1020" y2="200"/><line x1="600" y1="560" x2="40" y2="440"/><line x1="600" y1="560" x2="1160" y2="440"/><line x1="600" y1="560" x2="360" y2="90"/><line x1="600" y1="560" x2="840" y2="90"/>
</g>
<circle cx="600" cy="560" r="230" fill="url(#sun)"/>
<circle cx="600" cy="560" r="86" fill="#fff4cc"/>
<rect x="0" y="560" width="1200" height="340" fill="url(#ground)"/>
<!-- panel rows, far to near. Each: tilted panel face (parallelogram) with silver frame, cell grid, and sheen -->
<g id="rowfar">
  <polygon points="-40,586 1240,586 1240,598 -40,598" fill="#0f2352" stroke="#8fa3c8" stroke-width="1"/>
</g>
<g>
  <polygon points="-40,606 1240,606 1240,626 -40,632" fill="url(#panel)" stroke="url(#frame)" stroke-width="1.5"/>
  <polygon points="-40,606 1240,606 1240,626 -40,632" fill="url(#sheen)" opacity=".6"/>
</g>
<g>
  <polygon points="-40,648 1240,648 1240,684 -40,692" fill="url(#panel)" stroke="url(#frame)" stroke-width="2"/>
  <polygon points="-40,648 1240,648 1240,684 -40,692" fill="url(#sheen)" opacity=".6"/>
  <g stroke="#7fa3ff" stroke-opacity=".3"><line x1="100" y1="648" x2="96" y2="690"/><line x1="220" y1="648" x2="217" y2="690"/><line x1="340" y1="648" x2="338" y2="690"/><line x1="460" y1="648" x2="459" y2="690"/><line x1="580" y1="648" x2="580" y2="690"/><line x1="700" y1="648" x2="701" y2="690"/><line x1="820" y1="648" x2="822" y2="690"/><line x1="940" y1="648" x2="943" y2="690"/><line x1="1060" y1="648" x2="1064" y2="690"/><line x1="1180" y1="648" x2="1185" y2="690"/></g>
</g>
<g>
  <polygon points="-40,720 1240,720 1240,786 -40,796" fill="url(#panel)" stroke="url(#frame)" stroke-width="2.5"/>
  <polygon points="-40,720 1240,720 1240,786 -40,796" fill="url(#sheen)" opacity=".65"/>
  <g stroke="#7fa3ff" stroke-opacity=".32"><line x1="60" y1="720" x2="52" y2="794"/><line x1="200" y1="720" x2="194" y2="794"/><line x1="340" y1="720" x2="336" y2="794"/><line x1="480" y1="720" x2="478" y2="794"/><line x1="620" y1="720" x2="620" y2="794"/><line x1="760" y1="720" x2="762" y2="794"/><line x1="900" y1="720" x2="904" y2="794"/><line x1="1040" y1="720" x2="1046" y2="794"/><line x1="1180" y1="720" x2="1188" y2="794"/><line x1="-40,753" y1="754" x2="1240" y2="750"/></g>
  <line x1="-40" y1="758" x2="1240" y2="753" stroke="#7fa3ff" stroke-opacity=".32"/>
</g>
<g>
  <polygon points="-40,830 1240,830 1240,940 -40,960" fill="url(#panel)" stroke="url(#frame)" stroke-width="3"/>
  <polygon points="-40,830 1240,830 1240,940 -40,960" fill="url(#sheen)" opacity=".7"/>
  <g stroke="#7fa3ff" stroke-opacity=".34" stroke-width="1.5"><line x1="20" y1="830" x2="6" y2="958"/><line x1="200" y1="830" x2="190" y2="955"/><line x1="380" y1="830" x2="374" y2="952"/><line x1="560" y1="830" x2="558" y2="949"/><line x1="740" y1="830" x2="742" y2="946"/><line x1="920" y1="830" x2="926" y2="943"/><line x1="1100" y1="830" x2="1110" y2="940"/></g>
  <line x1="-40" y1="895" x2="1240" y2="885" stroke="#7fa3ff" stroke-opacity=".34" stroke-width="1.5"/>
</g>
<!-- posts between rows -->
<g stroke="#241209" stroke-width="5" stroke-linecap="round"><line x1="300" y1="692" x2="300" y2="712"/><line x1="900" y1="690" x2="900" y2="712"/><line x1="150" y1="796" x2="150" y2="826"/><line x1="600" y1="792" x2="600" y2="826"/><line x1="1050" y1="788" x2="1050" y2="826"/></g>
<!-- text on a soft plate for legibility over panels -->
<rect x="40" y="770" width="660" height="110" rx="14" fill="#160a1e" fill-opacity=".62"/>
<text x="70" y="820" font-family="Inter,Helvetica,Arial,sans-serif" font-size="72" font-weight="800" fill="#ffe1b0" letter-spacing="-1">HELX</text>
<text x="70" y="856" font-family="Inter,Helvetica,Arial,sans-serif" font-size="20" font-weight="500" fill="#ffc98a" letter-spacing="4">48 MW SOLAR PARK · ANDALUSIA · 15-YR PPA</text>
<g transform="translate(1030,730)"><circle cx="60" cy="60" r="60" fill="#160a1e" fill-opacity=".5" stroke="#ffd58a" stroke-opacity=".8" stroke-width="3"/><path d="M66 32 L44 66 H60 L54 88 L78 52 H62 Z" fill="#ffd58a"/></g>
</svg>
