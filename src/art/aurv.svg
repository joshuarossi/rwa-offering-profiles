<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
<defs>
  <radialGradient id="bg" cx="50%" cy="35%" r="75%"><stop offset="0" stop-color="#2a2410"/><stop offset=".55" stop-color="#120f08"/><stop offset="1" stop-color="#070604"/></radialGradient>
  <linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff2b0"/><stop offset=".35" stop-color="#f3cf5e"/><stop offset=".7" stop-color="#d9a52e"/><stop offset="1" stop-color="#f7dc7a"/></linearGradient>
  <linearGradient id="left" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c6901f"/><stop offset="1" stop-color="#7a5510"/></linearGradient>
  <linearGradient id="right" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e3b53d"/><stop offset="1" stop-color="#9c6f18"/></linearGradient>
  <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d4a53a" stop-opacity=".35"/><stop offset="1" stop-color="#d4a53a" stop-opacity="0"/></linearGradient>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffd76a" stop-opacity=".55"/><stop offset="1" stop-color="#ffd76a" stop-opacity="0"/></radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="1.2"/></filter>
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0H0V60" fill="none" stroke="#d4a53a" stroke-opacity=".07"/></pattern>
<g id="bar">
  <polygon points="0,0 240,0 300,60 60,60" fill="url(#top)"/>
  <polygon points="60,60 300,60 300,150 60,150" fill="url(#right)"/>
  <polygon points="0,0 60,60 60,150 0,90" fill="url(#left)"/>
  <polygon points="6,2 234,2 292,58 68,58" fill="none" stroke="#fff6cc" stroke-opacity=".5" stroke-width="1.5"/>
  <text x="150" y="40" font-family="Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#5d3f08" text-anchor="middle" letter-spacing="2" transform="skewX(-45) translate(40,0)">FINE GOLD 999.9</text>
</g>
</defs>
<rect width="1200" height="900" fill="url(#bg)"/>
<rect width="1200" height="900" fill="url(#grid)"/>
<ellipse cx="600" cy="330" rx="420" ry="260" fill="url(#glow)" filter="url(#blur)"/>
<!-- floor reflection -->
<ellipse cx="600" cy="720" rx="520" ry="110" fill="url(#floor)"/>
<!-- bars -->
<g transform="translate(90,500)"><use href="#bar"/></g>
<g transform="translate(390,500)"><use href="#bar"/></g>
<g transform="translate(690,500)"><use href="#bar"/></g>
<g transform="translate(150,560)"><use href="#bar"/></g>
<g transform="translate(450,560)"><use href="#bar"/></g>
<g transform="translate(750,560)"><use href="#bar"/></g>
<g transform="translate(300,470)"><use href="#bar"/></g>
<g transform="translate(600,470)"><use href="#bar"/></g>
<g transform="translate(450,380)"><use href="#bar"/></g>
<!-- glints -->
<g fill="#fff8d6" filter="url(#soft)">
  <path d="M560 372 l6 -22 6 22 22 6 -22 6 -6 22 -6 -22 -22 -6z"/>
  <path d="M900 470 l4 -14 4 14 14 4 -14 4 -4 14 -4 -14 -14 -4z"/>
  <path d="M250 560 l3 -10 3 10 10 3 -10 3 -3 10 -3 -10 -10 -3z"/>
</g>
<!-- text -->
<text x="70" y="820" font-family="Inter,Helvetica,Arial,sans-serif" font-size="72" font-weight="800" fill="#f2cf6e" letter-spacing="-1">AURV</text>
<text x="70" y="856" font-family="Inter,Helvetica,Arial,sans-serif" font-size="20" font-weight="500" fill="#c9a24a" letter-spacing="4">ALLOCATED GOLD · 1 TOKEN = 1 TROY OZ</text>
<circle cx="1090" cy="790" r="60" fill="none" stroke="#d4a53a" stroke-opacity=".6" stroke-width="3"/>
<circle cx="1090" cy="790" r="46" fill="none" stroke="#d4a53a" stroke-opacity=".35" stroke-width="1.5"/>
<text x="1090" y="801" font-family="Inter,Helvetica,Arial,sans-serif" font-size="30" font-weight="800" fill="#f2cf6e" text-anchor="middle">Au</text>
</svg>
