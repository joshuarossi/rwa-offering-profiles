<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
<defs>
  <radialGradient id="bg" cx="55%" cy="40%" r="70%"><stop offset="0" stop-color="#4a1220"/><stop offset=".6" stop-color="#22080f"/><stop offset="1" stop-color="#0e0407"/></radialGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1a0a0d"/><stop offset=".25" stop-color="#2b0f14"/><stop offset=".5" stop-color="#3b141b"/><stop offset=".8" stop-color="#1f0b10"/><stop offset="1" stop-color="#0f0508"/></linearGradient>
  <linearGradient id="hl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <linearGradient id="label" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3e9d2"/><stop offset="1" stop-color="#d9c9a3"/></linearGradient>
  <linearGradient id="wine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8e1b2e"/><stop offset="1" stop-color="#4a0a16"/></linearGradient>
  <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6b4a2b"/><stop offset="1" stop-color="#3b2716"/></linearGradient>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#e8736a" stop-opacity=".35"/><stop offset="1" stop-color="#e8736a" stop-opacity="0"/></radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="30"/></filter>
</defs>
<rect width="1200" height="900" fill="url(#bg)"/>
<ellipse cx="640" cy="420" rx="420" ry="300" fill="url(#glow)" filter="url(#blur)"/>
<!-- barrel end on right -->
<g transform="translate(980,300)">
  <circle r="170" fill="url(#wood)" stroke="#2a1a0e" stroke-width="6"/>
  <circle r="150" fill="none" stroke="#8a6a44" stroke-opacity=".5" stroke-width="2"/>
  <circle r="120" fill="none" stroke="#8a6a44" stroke-opacity=".35" stroke-width="2"/>
  <circle r="170" fill="none" stroke="#9aa0a8" stroke-width="10" stroke-opacity=".7"/>
  <g stroke="#2a1a0e" stroke-width="3"><line x1="-170" y1="-40" x2="170" y2="-40"/><line x1="-165" y1="40" x2="165" y2="40"/><line x1="-150" y1="-90" x2="150" y2="-90"/><line x1="-140" y1="100" x2="140" y2="100"/></g>
  <text y="10" font-family="Georgia,serif" font-size="34" font-weight="700" fill="#e9d7b0" text-anchor="middle" letter-spacing="3">CRU</text>
</g>
<!-- shelf / table -->
<rect x="0" y="700" width="1200" height="200" fill="#160709"/>
<rect x="0" y="696" width="1200" height="6" fill="#5a3a22"/>
<!-- bottles -->
<g id="bottle">
  <path d="M-30 0 V-160 Q-30 -195 -12 -215 V-330 H12 V-215 Q30 -195 30 -160 V0 Z" fill="url(#glass)"/>
  <rect x="-12" y="-345" width="24" height="28" rx="3" fill="#7a1a24"/>
  <rect x="-14" y="-348" width="28" height="8" rx="2" fill="#8f2430"/>
  <path d="M-6 -150 V-20" stroke="url(#hl)" stroke-width="6" stroke-linecap="round" opacity=".8"/>
  <rect x="-24" y="-130" width="48" height="90" fill="url(#label)"/>
  <rect x="-20" y="-126" width="40" height="82" fill="none" stroke="#8b1e2b" stroke-width="1.5"/>
  <text y="-98" font-family="Georgia,serif" font-size="8" fill="#7a1a24" text-anchor="middle" letter-spacing="1">CHÂTEAU</text>
  <text y="-82" font-family="Georgia,serif" font-size="8.5" font-weight="700" fill="#3a0a10" text-anchor="middle">GRAND CRU</text>
  <text y="-58" font-family="Georgia,serif" font-size="12" font-weight="700" fill="#8b1e2b" text-anchor="middle">2016</text>
</g>
<g transform="translate(200,696)"><use href="#bottle"/></g>
<g transform="translate(290,696) scale(1.05)"><use href="#bottle"/></g>
<g transform="translate(385,696)"><use href="#bottle"/></g>
<g transform="translate(480,696) scale(1.05)"><use href="#bottle"/></g>
<g transform="translate(575,696)"><use href="#bottle"/></g>
<!-- glass -->
<g transform="translate(760,696)">
  <path d="M-60 -260 Q-70 -160 0 -120 Q70 -160 60 -260 Z" fill="#ffffff" fill-opacity=".06" stroke="#f0d9d9" stroke-opacity=".5" stroke-width="2"/>
  <path d="M-56 -210 Q-62 -150 0 -122 Q62 -150 56 -210 Z" fill="url(#wine)"/>
  <path d="M-52 -210 Q0 -195 52 -210" stroke="#c0392b" stroke-width="3" fill="none" opacity=".9"/>
  <line x1="0" y1="-120" x2="0" y2="-10" stroke="#f0d9d9" stroke-opacity=".5" stroke-width="2"/>
  <path d="M-46 -8 H46" stroke="#f0d9d9" stroke-opacity=".5" stroke-width="3" stroke-linecap="round"/>
  <path d="M-40 -240 Q-46 -190 -20 -160" stroke="#fff" stroke-opacity=".25" stroke-width="4" fill="none" stroke-linecap="round"/>
</g>
<text x="70" y="820" font-family="Inter,Helvetica,Arial,sans-serif" font-size="72" font-weight="800" fill="#f2d9c8" letter-spacing="-1">CRU</text>
<text x="70" y="856" font-family="Inter,Helvetica,Arial,sans-serif" font-size="20" font-weight="500" fill="#d8a0a0" letter-spacing="4">FINE WINE CELLAR · 1,180 CASES IN BOND</text>
<g transform="translate(1030,730)"><circle cx="60" cy="60" r="60" fill="none" stroke="#e8736a" stroke-opacity=".7" stroke-width="3"/><text x="60" y="72" font-family="Georgia,serif" font-size="34" font-weight="700" fill="#f2d9c8" text-anchor="middle">1er</text></g>
